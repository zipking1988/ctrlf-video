name: Test and deploy CtrlF Video

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_drill:
        description: Verify a failed backend release recovers before deployment
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ctrlfvideo-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.10.12'
          python-version: '3.13.12'
          enable-cache: false
      - name: Install isolated media dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg bubblewrap apparmor
          # Ubuntu restricts capabilities in unprivileged namespaces. Load the
          # package's binary-specific policy; keep the global restriction enabled.
          found=false
          for profile in /etc/apparmor.d/*bwrap*; do
            if [ -f "$profile" ]; then
              sudo apparmor_parser -r "$profile"
              found=true
            fi
          done
          if [ "$found" = false ]; then
            printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' \
              'profile ctrlf-ci-bwrap /usr/bin/bwrap flags=(unconfined) {' \
              '  userns,' '}' | sudo tee /etc/apparmor.d/ctrlf-ci-bwrap >/dev/null
            sudo apparmor_parser -r /etc/apparmor.d/ctrlf-ci-bwrap
          fi
      - name: Test frontend and verify committed assets
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build
          git diff --exit-code -- src/ctrlf_video/static
      - name: Check and test backend, Linux isolation and deployment recovery
        run: |
          uv sync --frozen
          make check
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          /usr/bin/bwrap --unshare-all --ro-bind / / /usr/bin/true
          make test

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: gcp-test
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Enforce authorized window before builds or credentials
        run: python3 -c 'import time; assert time.time() < 1792414800, "Deployment window closed"'
      - name: Build frontend from tested committed assets
        run: docker build --target frontend -t "asia-northeast1-docker.pkg.dev/ctrlfvideo/ctrlfvideo/frontend:ci-${GITHUB_SHA}-${GITHUB_RUN_ID}" .
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        id: gcp-auth
        with:
          workload_identity_provider: projects/655757141159/locations/global/workloadIdentityPools/ctrlfvideo-github/providers/main
          service_account: ctrlfvideo-deployer@ctrlfvideo.iam.gserviceaccount.com
          token_format: access_token
          access_token_lifetime: 1800s
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          version: '574.0.0'
      - name: Push private image and deploy both components
        env:
          ROLLBACK_DRILL: ${{ inputs.rollback_drill || 'false' }}
          GCP_DEPLOY_ACCESS_TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
          CLOUDSDK_AUTH_ACCESS_TOKEN_FILE: ${{ runner.temp }}/ctrlf-gcp-access-token
        run: |
          # The explicit, short-lived SA token covers the bounded deployment job;
          # refreshing a five-minute GitHub OIDC assertion mid-release can fail.
          umask 077
          printf '%s' "$GCP_DEPLOY_ACCESS_TOKEN" > "$CLOUDSDK_AUTH_ACCESS_TOKEN_FILE"
          unset GCP_DEPLOY_ACCESS_TOKEN
          trap 'rm -f "$CLOUDSDK_AUTH_ACCESS_TOKEN_FILE"' EXIT
          gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet
          image="asia-northeast1-docker.pkg.dev/ctrlfvideo/ctrlfvideo/frontend:ci-${GITHUB_SHA}-${GITHUB_RUN_ID}"
          docker push "$image"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$image")"
          export FRONTEND_IMAGE="$digest"
          python3 deploy/gcp/deploy.py
