# INERT TEMPLATE. Supply an immutable frontend image and verified backend.
# No model credentials or persistent media are configured in the frontend.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ctrlfvideo-frontend
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '1'
    spec:
      containerConcurrency: 32
      timeoutSeconds: 300
      containers:
        - image: REPLACE_WITH_REVIEWED_FRONTEND_IMAGE_DIGEST
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: '1'
              memory: 512Mi
          env:
            - name: CTRLF_COMPONENT
              value: frontend
            - name: CTRLF_PUBLIC_ORIGIN
              value: https://REPLACE_WITH_PUBLIC_FRONTEND_HOST
            - name: CTRLF_BACKEND_ORIGIN
              value: https://REPLACE_WITH_GCP_BACKEND_HOST
            - name: CTRLF_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: REPLACE_WITH_PRIVATE_GATEWAY_SECRET
                  key: REPLACE_WITH_PINNED_SECRET_VERSION
